<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时钟</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif}
.card{text-align:center;padding:48px}
.time{font-size:72px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.date{font-size:20px;color:#94a3b8;margin-top:8px}
.timezone{font-size:14px;color:#64748b;margin-top:16px}
@media(max-width:600px){.time{font-size:52px}}
</style>
</head>
<body>
<div class="card">
  <div class="time" id="time">--:--:--</div>
  <div class="date" id="date">----</div>
  <div class="timezone">Asia/Shanghai</div>
</div>
<script>
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  const now=new Date();
  document.getElementById('time').textContent = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  const opts={year:'numeric',month:'long',day:'numeric',weekday:'long'};
  document.getElementById('date').textContent = now.toLocaleDateString('zh-CN',opts);
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
